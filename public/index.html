<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commonplace</title>
  <meta name="description" content="A personal collection of favourite quotes.">
  <meta name="theme-color" content="#f5f4f9">
  <script>
    // Apply the saved light/dark choice before anything is drawn (no flash).
    (function () {
      var p = 'light';
      try { p = localStorage.getItem('commonplace:theme') || 'light'; } catch (e) {}
      var dark = p === 'dark' || (p === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Commonplace">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Commonplace</span></div>
      <div class="top-actions">
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch theme"></button>
        <button class="sync-pill" id="sync-pill" type="button" aria-label="Sync status"></button>
      </div>
    </header>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <main id="main"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Views">
    <button type="button" data-tab="random" aria-label="Random quote"></button>
    <button type="button" data-tab="list" aria-label="All quotes"></button>
    <button type="button" data-action="add" class="tab-add" aria-label="Add a quote"></button>
    <button type="button" data-action="settings" aria-label="Settings"></button>
  </nav>

  <div id="sheet-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
